spring.application.name=ApiGateway

# ---------------------------------------------------------------------------
# JWT
# ---------------------------------------------------------------------------
# Mesmo segredo do UserService (emissor dos tokens).
jwt.secret=${JWT_SECRET:dev-secret-key-with-at-least-32-characters-change-me}
jwt.issuer=${JWT_ISSUER:user-service}

# ---------------------------------------------------------------------------
# Rotas para os microsservicos
# ---------------------------------------------------------------------------
# Cada requisicao recebida pelo gateway e encaminhada para o servico cujo
# prefixo de path corresponde. O path e preservado (sem StripPrefix), entao
# GET /user/ping no gateway chega como GET /user/ping no UserService.
#
# As URIs usam o nome do servico na rede Docker gerenciador-net e podem ser
# sobrescritas por variaveis de ambiente para execucao fora do Docker:
#   USER_SERVICE_URI=http://localhost:8081
#   TASK_SERVICE_URI=http://localhost:8082
#   NOTIFICATION_SERVICE_URI=http://localhost:8083

spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${USER_SERVICE_URI:http://user-service:8080}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/user/**

spring.cloud.gateway.server.webmvc.routes[1].id=task-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${TASK_SERVICE_URI:http://task-service:8080}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/task/**

spring.cloud.gateway.server.webmvc.routes[2].id=notification-service
spring.cloud.gateway.server.webmvc.routes[2].uri=${NOTIFICATION_SERVICE_URI:http://notification-service:8080}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/notification/**

# Login e registro ficam no UserService e tambem passam pelo gateway.
spring.cloud.gateway.server.webmvc.routes[3].id=auth-service
spring.cloud.gateway.server.webmvc.routes[3].uri=${USER_SERVICE_URI:http://user-service:8080}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/auth/**
