spring.application.name=UserService

# ---------------------------------------------------------------------------
# JWT
# ---------------------------------------------------------------------------
# O segredo e compartilhado com o API Gateway e os demais microsservicos.
# Em producao, defina JWT_SECRET no ambiente com um valor forte e unico.
jwt.secret=${JWT_SECRET:dev-secret-key-with-at-least-32-characters-change-me}
jwt.issuer=${JWT_ISSUER:user-service}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
