# Ambiente de desenvolvimento com hot reload.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# O codigo e montado via bind mount. O entrypoint da imagem dev (docker/dev/dev-run.sh)
# usa inotify para detectar saves em *.java/*.properties/*.xml, roda `mvn compile`
# e o Spring Boot DevTools reinicia a aplicacao. O container permanece de pe;
# apenas o contexto Spring e reiniciado, sem rebuild de imagem.

x-dev-service: &dev-service
  build:
    context: .
    dockerfile: docker/dev/Dockerfile
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  working_dir: /workspace
  restart: "no"
  environment:
    SPRING_DEVTOOLS_RESTART_ENABLED: "true"
    # Por padrao o DevTools nao reinicia para arquivos em resources/.
    # No backend queremos que alteracoes em application.properties tambem
    # tenham efeito na API sem subir os containers novamente.
    SPRING_DEVTOOLS_RESTART_EXCLUDE: ""

services:
  user-service:
    <<: *dev-service
    image: gerenciador-de-tarefas-user-service-dev
    volumes:
      - ./UserService:/workspace
      - maven-cache:/home/dev/.m2

  task-service:
    <<: *dev-service
    image: gerenciador-de-tarefas-task-service-dev
    volumes:
      - ./TaskService:/workspace
      - maven-cache:/home/dev/.m2

  notification-service:
    <<: *dev-service
    image: gerenciador-de-tarefas-notification-service-dev
    volumes:
      - ./NotificationService:/workspace
      - maven-cache:/home/dev/.m2

  api-gateway:
    <<: *dev-service
    image: gerenciador-de-tarefas-api-gateway-dev
    volumes:
      - ./ApiGateway:/workspace
      - maven-cache:/home/dev/.m2

volumes:
  maven-cache:
